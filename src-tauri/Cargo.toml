[package]
name = "kestrel"
version = "26.11.2"
description = "Kestrel desktop app"
edition = "2021"
rust-version = "1.85"

[lib]
name = "kestrel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Nikon High Efficiency (HE/HE*) decoding from the sensor data (crates/kestrel-raw, via ticoraw, MIT OR Apache-2.0). In every
# build by owner decision (19 Nov 2026; the codec is patented, see NOTICE.md). `--no-default-features` leaves it out.
default = ["nikon-he"]
nikon-he = ["kestrel-raw/nikon-he"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-persisted-scope = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rawler = "0.8"
kestrel-raw = { path = "../crates/kestrel-raw", default-features = false, features = ["parallel"] }
rayon = "1"
kestrel-vision = { path = "../crates/kestrel-vision" }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff"] }
