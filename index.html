<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Inside the installed app on a touch device the page behaves like an app, not a web page: no pinch, double-tap or
      // focus zoom (it zoomed in and cropped the screen). A browser keeps its own zoom, which people rely on to read.
      if ('__TAURI_INTERNALS__' in window && navigator.maxTouchPoints > 0) {
        document.querySelector('meta[name="viewport"]').setAttribute('content',
          'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon-light.svg" data-inflight-theme-icon />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/app-icon-rust-180.png" />
    <meta name="theme-color" content="#0e1116" />
    <title>InFlight — Local-First Photo Culling</title>
    <meta
      name="description"
      content="Local-first wildlife, bird, and pet photo culling workspace for Nikon Z8 and Z5II shooters with burst grouping, wipe comparison, and programmable macro pad shortcuts."
    />
    <meta property="og:title" content="InFlight — Local-First Photo Culling" />
    <meta
      property="og:description"
      content="Local-first wildlife, bird, and pet photo culling workspace for Nikon Z8 and Z5II shooters."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-kestrel-canvas text-zinc-100 antialiased selection:bg-sky-500/30 selection:text-sky-100">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
