# One-off model conversion and parity gate on a GitHub runner (16 GB RAM), started by hand. Converted models and gate
# reports are uploaded as a run artifact (kept 14 days) and are never committed. Model weights stay out of git.
name: Model conversion

on:
  workflow_dispatch:
    inputs:
      model:
        description: Which conversion to run
        required: true
        type: choice
        options: [birefnet-lite]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tools (CPU only)
        run: |
          python -m pip install --no-cache-dir torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==5.24.1 timm==1.0.31 kornia==0.9.2 einops==0.8.2 safetensors==0.8.0 \
            onnx==1.23.2 onnxruntime==1.32.0 numpy pillow psutil
      - name: Convert and gate (${{ inputs.model }})
        run: python -I tools/model-conversion/birefnet_lite.py all "$RUNNER_TEMP/birefnet"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.model }}-converted
          path: ${{ runner.temp }}/birefnet/out/
          retention-days: 14
          if-no-files-found: error
