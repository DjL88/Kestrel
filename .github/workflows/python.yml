name: Python checks
# The Nikon evidence harness, cull/RAW evidence and denoiser tooling. Runs only when Python or its inputs change.
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tools/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['scripts/**', 'tools/**', '.github/workflows/python.yml']
  workflow_dispatch:
concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  nikon-evidence:
    name: Nikon evidence harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-nikon-qa.txt
      - run: python -m pip install -r scripts/requirements-nikon-qa.txt pytest
      # These tests generate their own TIFFs/JSON. No SDK, camera photos or cloud account is needed.
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s tools/cull-evidence
      - run: python -m unittest discover -s tools/raw-evidence
      # Denoiser training tools: catalogue reading, noise calibration and dataset building. The training tests need
      # torch and skip themselves here; run them locally (see tools/denoise-training/README.md).
      - run: python -m unittest discover -s tools/denoise-training -p 'test_*.py'
