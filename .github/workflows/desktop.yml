name: Desktop app

on:
  pull_request:
    paths: ['src-tauri/**', 'src/**', 'package.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Optimised release build for testing on a real computer (slower to build, much faster to run) instead of a debug build'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Native installers must ship functional offline species recognition.
      # The public release model is checked against its pinned SHA-256 + size
      # by the fetch script; a missing/corrupt asset fails the build.
      - uses: actions/cache@v4
        with:
          path: public/models/bioclip-image-int8.onnx
          key: species-bioclip-int8-ea4095eb31a27964
      - name: Verify and package offline species recognition
        run: npm run model:species
      - name: Build the desktop app (unsigned, debug)
        if: ${{ !inputs.release }}
        env:
          VITE_SPECIES_MODEL_URL: /models/bioclip-image-int8.onnx
          VITE_SPECIES_MODEL_BUNDLED: 'true'
        run: npx tauri build --debug --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Build the desktop app (unsigned, optimised release)
        if: ${{ inputs.release }}
        env:
          VITE_SPECIES_MODEL_URL: /models/bioclip-image-int8.onnx
          VITE_SPECIES_MODEL_BUNDLED: 'true'
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-desktop-${{ matrix.os }}
          path: |
            src-tauri/target/debug/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 7
