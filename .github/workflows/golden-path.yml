name: Golden path
# The owner's target flow as one scorecard (docs/GOLDEN-PATH.md). Manual only: it is not part of the required CI job, so it
# never slows a pull request. Run it from the Actions tab (choose "fast" for the quick desktop subset), and read the score in
# the job summary. To record a full run in docs/golden-path-history.md, run `npm run golden-path -- --record` locally and
# commit the new row.
on:
  workflow_dispatch:
    inputs:
      fast:
        description: 'Fast subset (desktop only, a few minutes) instead of every check'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: golden-path
  cancel-in-progress: false
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run models:fetch
      - run: npx playwright install --with-deps chromium
      - name: Golden path
        # A FAIL fails the job; NOT BUILT, MANUAL and NOT RUN are reported in the scorecard, not failed.
        run: npm run golden-path -- ${{ inputs.fast && '--fast' || '' }}
      - name: Scorecard in the job summary
        if: always()
        run: |
          if [ -f golden-path-out/golden-path-scorecard.md ]; then cat golden-path-out/golden-path-scorecard.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-path-out
          path: golden-path-out/
          retention-days: 30
