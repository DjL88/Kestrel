name: CI
# Lint, unit tests, build and the V2 browser specs. Kept cheap for paid minutes:
# - one run per PR or branch at a time (a new push cancels the old run);
# - docs-only changes skip it (paths-ignore);
# - npm and the Playwright browser are cached;
# - only the V2 product's specs run (tests/v2-*, plus the website and admin pages). The retired V1 specs still run
#   locally with `npx playwright test`; they are not worth paid minutes now that V2 is the app.
# Python checks live in python.yml, desktop bundles in desktop.yml (both path-filtered).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    # Draft PRs do not run (marking one ready for review starts it); run a draft by hand with workflow_dispatch.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/check-release-version.test.mjs
      - run: node scripts/check-release-version.mjs
      - run: npm run lint
      - run: npm test
      # AI Studio/GitHub cloud imports can omit large checked-in ONNX binaries.
      # Build once with the model directory hidden, then restore it in finally.
      - name: Build preview with optional models absent
        run: node scripts/check-preview-without-models.mjs
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Playwright builds and serves the production app before running the tests. Desktop and phone projects.
      # Fail fast and cheap: stop after 20 failures, and never let the browser step run past 25 minutes (everything
      # before this step takes about 2.5 minutes on GitHub). Each test still has its 90 s limit for slow on-device models.
      - name: V2 browser tests
        timeout-minutes: 25
        run: npx playwright test tests/v2- tests/site- tests/admin- --workers=2 --max-failures=20
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
