name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  nikon-evidence:
    name: Nikon evidence harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-nikon-qa.txt
      - run: python -m pip install -r scripts/requirements-nikon-qa.txt
      # These tests generate their own TIFFs/JSON. No SDK, camera photos or cloud account is needed.
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/check-release-version.test.mjs
      - run: node scripts/check-release-version.mjs
      - run: npm run lint
      - run: npm test
      # AI Studio/GitHub cloud imports can omit large checked-in ONNX binaries.
      # Build once with the model directory hidden, then restore it in finally.
      - name: Build preview with optional models absent
        run: node scripts/check-preview-without-models.mjs
      - run: npx playwright install --with-deps chromium
      # Playwright builds and serves the production app before running the tests.
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
