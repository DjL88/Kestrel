name: CI
# Lint, unit tests, build and the V2 browser specs. Kept cheap for paid minutes:
# - one run per PR or branch at a time (a new push cancels the old run);
# - docs-only changes skip it (paths-ignore);
# - npm and the Playwright browser are cached;
# - every browser spec runs (the previous interface and its specs were removed on 26 Nov 2026), and any failure fails CI.
# Python checks live in python.yml, desktop bundles in desktop.yml (both path-filtered).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    # Draft PRs do not run (marking one ready for review starts it); run a draft by hand with workflow_dispatch.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
# A new push to a PR cancels that PR's older run. On main a running check is never cancelled (GitHub keeps one waiting
# run and a newer merge replaces only that one), so there is always a recent finished result to deploy from.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The bundled models are not in git (models/bundled-models.json); npm run build fetches them by checksum from the
      # public models bucket. Cached by the list, so they download once per change, not on every run.
      - uses: actions/cache@v4
        with:
          path: |
            public/models/clip-vit-b32-vision-uint8.onnx
            public/models/dinov2-small-fp16.onnx
            public/models/species-world.json
            public/models/species-mammals.json
            public/models/species-reptiles.json
            public/models/species-amphibians.json
            public/models/species-odonata.json
            public/models/species-lepidoptera.json
          key: bundled-models-${{ hashFiles('models/bundled-models.json') }}
      - run: node --test scripts/check-release-version.test.mjs
      - run: node scripts/check-release-version.mjs
      - run: npm run lint
      - run: npm test
      # AI Studio/GitHub cloud imports can omit large checked-in ONNX binaries.
      # Build once with the model directory hidden, then restore it in finally.
      - name: Build preview with optional models absent
        run: node scripts/check-preview-without-models.mjs
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Playwright builds and serves the production app before running the tests. Desktop and phone projects.
      # Every spec runs and any failure fails the job; the step never runs past 25 minutes (everything before it takes
      # about 2.5 minutes on GitHub). Each test still has its 90 s limit for slow on-device models.
      - name: Browser tests
        timeout-minutes: 25
        run: npx playwright test --workers=2
      # Board job p5-export: full-size exports are pixel-exact to the intended render and originals are never changed,
      # proved through the real app on synthetic files and two CC0 camera RAWs from raw.pixls.us (about 50 MB, cached,
      # pinned by SHA-256 in tests/exportExactness.ts, never committed).
      - uses: actions/cache@v4
        with:
          path: raw-samples
          key: raw-samples-exactness-v1
      - name: Fetch CC0 camera RAWs for the export proof
        run: node scripts/fetch-raw-samples.mjs --exactness
      # Every dev-server spec: export exactness and originals untouched, the verified-asset specs, and the account specs.
      - name: Dev-server browser tests
        timeout-minutes: 25
        run: npx playwright test -c playwright.dev.config.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
