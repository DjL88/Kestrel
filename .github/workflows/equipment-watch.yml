name: Check equipment catalogue sources

# Only discovers candidates. This workflow never modifies shipped files,
# publishes an app/data release, or deploys unreviewed profiles.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source:
          - { owner: lensfun, repo: lensfun }
          - { owner: LibRaw, repo: LibRaw }
          - { owner: Imageomics, repo: bioclip }
    steps:
      - name: Review upstream revision for ${{ matrix.source.owner }}/${{ matrix.source.repo }}
        uses: actions/github-script@v7
        env:
          UPSTREAM_OWNER: ${{ matrix.source.owner }}
          UPSTREAM_REPO: ${{ matrix.source.repo }}
        with:
          script: |
            const source = { owner: process.env.UPSTREAM_OWNER, repo: process.env.UPSTREAM_REPO };
            const repository = await github.rest.repos.get(source);
            const branch = repository.data.default_branch;
            const commit = await github.rest.repos.getCommit({ ...source, ref: branch });
            const sha = commit.data.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid upstream revision.');
            const board = 418; // One open research queue shared with Kestrel's other coding agents.
            const url = `https://github.com/${source.owner}/${source.repo}/commit/${sha}`;

            // Search only the canonical board's comments, not the archived one-issue-per-SHA notices.
            // This keeps re-runs and weekly unchanged upstreams from growing a comment backlog.
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:comments "${sha}"`,
              per_page: 100
            });
            if (search.data.items.some(item => item.number === board)) {
              core.info(`${source.owner}/${source.repo}: ${sha} already recorded on #${board}; skipping.`);
              return;
            }

            // Fail closed if the board has been retired: never fall back to producing
            // unreviewed standalone issues or activating a model/decoder release.
            const issue = await github.rest.issues.get({ ...context.repo, issue_number: board });
            if (issue.data.state !== 'open' || issue.data.pull_request) {
              throw new Error('The Kestrel research board #418 is not an open issue.');
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: board,
              body: [
                `### Equipment update candidate — ${source.owner}/${source.repo} @ ${sha.slice(0, 12)}`,
                '',
                '**Automated discovery only; NOT an approved or tested Kestrel update.**',
                `Upstream: [${source.owner}/${source.repo}](https://github.com/${source.owner}/${source.repo}) on branch \`${branch}\``,
                `Commit: [${sha}](${url})`,
                '',
                'Review upstream licence and attribution, sensor/RAW support, optical calibration or model I/O, and relevant real-photo fixture tests.',
                'Prepare a separate reviewed PR or signed data release if useful; never auto-merge, auto-install or infer decoder/species support.',
                'Track under K-05/K-10 (LibRaw), K-08/K-10 (Lensfun), or K-03/K-09 (BioCLIP) as appropriate.',
                '',
                'Guide: [docs/EQUIPMENT-UPDATES.md](../blob/main/docs/EQUIPMENT-UPDATES.md)'
              ].join('\n')
            });
            core.info(`Recorded ${source.owner}/${source.repo} ${sha} on board #${board}.`);
