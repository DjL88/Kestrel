name: Check equipment catalogue sources

# Only discovers candidates. This workflow never modifies shipped files,
# publishes an app/data release, or deploys unreviewed profiles.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch-lensfun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check official Lensfun repository for a new revision
        uses: actions/github-script@v7
        with:
          script: |
            const source = { owner: 'lensfun', repo: 'lensfun' };
            const repository = await github.rest.repos.get(source);
            const branch = repository.data.default_branch;
            const commit = await github.rest.repos.getCommit({ ...source, ref: branch });
            const sha = commit.data.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid upstream revision.');
            const title = `Review Lensfun upstream revision ${sha.slice(0, 12)}`;
            // Find an issue with the exact upstream commit (not the commit subject).
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
              per_page: 10
            });
            const alreadyFiled = search.data.items.some(item => item.title === title);
            core.info(`Lensfun ${branch} at ${sha}; review issue present: ${alreadyFiled}`);
            if (alreadyFiled) return;
            const url = `https://github.com/lensfun/lensfun/commit/${sha}`;
            await github.rest.issues.create({
              ...context.repo,
              title,
              body: [
                'Automated **candidate discovery** only — not an approved Kestrel update.',
                '',
                `Upstream: [Lensfun](https://github.com/lensfun/lensfun) on branch \`${branch}\``,
                `Commit: [${sha}](${url})`,
                '',
                'Review upstream licence and attribution, camera/lens changes, correction calibration, compatibility and fixture tests.',
                'If worthwhile, prepare a separate reviewed Kestrel PR and signed data release.',
                '**Do not** auto-merge, auto-publish or claim RAW decoder support from this notice.',
                '',
                'Guide: [docs/EQUIPMENT-UPDATES.md](https://github.com/DjL88/Kestrel/blob/main/docs/EQUIPMENT-UPDATES.md)'
              ].join('\\n')
            });
