name: Release desktop apps

# Push a tag such as v0.1.1 on a known-good main commit to build every desktop system as a DRAFT GitHub release.
# Nothing reaches users until the owner publishes the draft: the updater only reads the latest published release.
# See docs/RELEASE-FLOW.md.
# Signing switches itself on from the repository secrets that exist (scripts/release-signing.mjs):
#   update files: TAURI_SIGNING_PRIVATE_KEY (+ optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
#   macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY; notarising adds APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: SSL.com eSigner (ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET), Azure Trusted Signing (AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_SIGNING_ENDPOINT,
#            AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE) or a certificate file (WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD)
# With no secrets the builds are unsigned and the release says so. A half-configured part stops the release.
# Owner steps: docs/DESKTOP.md, "Signing and notarising checklist".
on:
  push:
    tags: ['v*']

# One release run per tag; never cancel a release half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
          # 24.04, not 22.04: a prebuilt native library (onnxruntime through ort) needs glibc 2.38+ (__isoc23_strtol); 22.04 has 2.35.
          - os: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Release flow (docs/RELEASE-FLOW.md): only a commit that is already on main can be promoted.
      - name: Refuse a tag that is not on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Tag a known-good main commit instead."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci
      # The bundled models are not in git (models/bundled-models.json); npm run build fetches them by checksum from the
      # public models bucket. Cached by the list, so they download once per change, not on every run.
      - uses: actions/cache@v4
        with:
          path: |
            public/models/clip-vit-b32-vision-uint8.onnx
            public/models/dinov2-small-fp16.onnx
            public/models/species-world.json
            public/models/species-mammals.json
            public/models/species-reptiles.json
            public/models/species-amphibians.json
            public/models/species-odonata.json
            public/models/species-lepidoptera.json
          key: bundled-models-${{ hashFiles('models/bundled-models.json') }}
      - name: Verify release tag matches web, native and Rust versions
        env:
          KESTREL_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --test scripts/check-release-version.test.mjs
          node scripts/check-release-version.mjs
      - name: Import Windows certificate file (only when its secrets exist)
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) { exit 0 }
          $path = Join-Path $env:RUNNER_TEMP 'kestrel-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Install Azure Trusted Signing client (only when its secrets exist)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then cargo install trusted-signing-cli --locked; fi
      - name: Install SSL.com CodeSignTool (only when its secrets exist)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
        run: |
          if (-not $env:ES_USERNAME) { exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP 'codesigntool.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Invoke-WebRequest -Uri 'https://www.ssl.com/download/codesigntool-for-windows/' -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $bat = Get-ChildItem $dir -Recurse -Filter CodeSignTool.bat | Select-Object -First 1
          if (-not $bat) { throw 'CodeSignTool.bat not found in the SSL.com download.' }
          "CODESIGNTOOL_DIR=$($bat.DirectoryName)" >> $env:GITHUB_ENV
      - name: Choose signing from the secrets that exist
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.wincert.outputs.thumbprint }}
        run: |
          node --test scripts/release-signing.test.mjs
          node scripts/release-signing.mjs
      # Intel Macs: pyke ships no Intel Mac runtime for ort any more, so both halves of the universal app link Microsoft's
      # ONNX Runtime 1.23.2 (its last Intel Mac release), from its signed NuGet package pinned by size and SHA-512, joined into
      # one universal library (scripts/macos/fetch-onnxruntime.sh). Kept outside the checkout, so the tree stays clean.
      - name: ONNX Runtime for both Mac architectures (Microsoft 1.23.2, pinned)
        id: ort
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          bash scripts/macos/fetch-onnxruntime.sh "$RUNNER_TEMP/onnxruntime"
          printf '{"bundle":{"macOS":{"frameworks":["%s"]}}}\n' "$RUNNER_TEMP/onnxruntime/libonnxruntime.dylib" > "$RUNNER_TEMP/onnxruntime-frameworks.json"
          echo "args=--config $RUNNER_TEMP/onnxruntime-frameworks.json" >> "$GITHUB_OUTPUT"
          # The app build links it instead of downloading one (set for the macOS job only).
          echo "ORT_LIB_LOCATION=$RUNNER_TEMP/onnxruntime" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
      # Proof that the native models run on both kinds of Mac, not only that they link: one small model (u2netp, in git),
      # one inference, built for each architecture and run natively and, for Intel, under Rosetta.
      - name: Native models run on Apple silicon and on Intel (Rosetta)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          ORT_LIB_LOCATION: ${{ runner.temp }}/onnxruntime
          ORT_PREFER_DYNAMIC_LINK: '1'
          CARGO_TARGET_DIR: ${{ runner.temp }}/ort-smoke
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --example ort_smoke --manifest-path crates/kestrel-vision/Cargo.toml --target "$target"
            bin="$CARGO_TARGET_DIR/$target/release/examples/ort_smoke"
            lipo -info "$bin"
            if [ "$target" = x86_64-apple-darwin ]; then arch=x86_64; else arch=arm64; fi
            DYLD_LIBRARY_PATH="$ORT_LIB_LOCATION" arch "-$arch" "$bin" src/assets/models/u2netp.onnx
          done
      - uses: tauri-apps/tauri-action@v0
        with:
          # The action picks bun when it sees bun.lock, and bun is not installed on the runners; build with npm like CI.
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: InFlight ${{ github.ref_name }}
          releaseBody: ${{ steps.signing.outputs.release_note }}
          releaseDraft: true
          # Windows updates use the NSIS installer, the same one people install, so an update never adds a second MSI copy.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }} ${{ steps.ort.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The app itself carries the library in Contents/Frameworks, finds it there, and that copy runs on both kinds of Mac.
      - name: The Mac app carries ONNX Runtime and finds it
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app="$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)"
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lib="$app/Contents/Frameworks/libonnxruntime.dylib"
          test -f "$lib"
          lipo -info "$lib" | grep -q x86_64
          lipo -info "$lib" | grep -q arm64
          lipo -info "$exe" | grep -q x86_64
          lipo -info "$exe" | grep -q arm64
          otool -L "$exe" | grep '@rpath/libonnxruntime.dylib'
          otool -l "$exe" | grep -A2 LC_RPATH | grep '@executable_path/../Frameworks'
          for pair in arm64:aarch64-apple-darwin x86_64:x86_64-apple-darwin; do
            DYLD_LIBRARY_PATH="$app/Contents/Frameworks" arch "-${pair%%:*}" "$RUNNER_TEMP/ort-smoke/${pair#*:}/release/examples/ort_smoke" src/assets/models/u2netp.onnx
          done
